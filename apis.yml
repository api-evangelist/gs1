- aid: gs1:gs1-queries-api
  name: GS1 Queries API
  description: >-
    Endpoints to create large named or anonymous queries using the EPCIS Query Language. Named queries
    have a custom

    name and are stored until deleted by the user. Anonymous queries are not persisted and only available
    to the caller.

    EPCIS events queries also support query subscription.
