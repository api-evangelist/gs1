apis:
- aid: gs1:gs1-digital-link-resolver
  name: GS1 Digital Link Resolver (id.gs1.org)
  description: >-
    GS1 AISBL's own live, unauthenticated GS1-Conformant Resolver, implementing the GS1-Conformant Resolver
    Standard 1.2.0. It takes a GS1 Digital Link URI built from a GS1 identification key and returns either
    a 303 redirect to the brand owner's target resource or, on request, an RFC 9264 linkset enumerating
    every registered link type for that key. The resolver description document at /.well-known/gs1resolver
    declares the supported primary keys — 00 (SSCC), 01 (GTIN), 253 (GDTI), 255 (GCN), 401 (GINC), 402
    (GSIN), 414/415/417 (GLN), 8003 (GRAI), 8004 (GIAI), 8006 (ITIP), 8010 (CPID), 8013 (GMN) and 8017/8018
    (GSRN) — which includes the consignment and shipment keys logistics parties actually quote. No key,
    no signup and no contract is required to call it.
  humanURL: https://ref.gs1.org/standards/resolver/
  baseURL: https://id.gs1.org
  tags:
  - GS1 Digital Link
  - Resolver
  - Identifiers
  - Linked Data
  - Track and Trace
  - Standards
  properties:
  - type: Specification
    url: https://ref.gs1.org/standards/resolver/1.2.0/
  - type: JSONSchema
    url: json-schema/gs1-resolver-linkset-schema.json
  - type: JSONSchema
    url: json-schema/gs1-resolver-description-file-schema.json
  - type: WellKnown
    url: well-known/gs1-resolver-description.json
  - type: JSONLD
    url: json-ld/gs1-resolver-linkset-context.jsonld
  - type: Vocabulary
    url: json-ld/gs1-web-vocabulary-linktypes.json
  - type: Documentation
    url: https://www.gs1.org/standards/gs1-digital-link
  - type: Artefacts
    url: https://ref.gs1.org/standards/resolver/artefacts
  - type: TestSuite
    url: https://ref.gs1.org/test-suites/resolver/
  - type: SourceCode
    url: https://github.com/gs1/GS1_DigitalLink_Resolver_CE
