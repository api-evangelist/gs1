url: https://raw.githubusercontent.com/api-evangelist/gs1/refs/heads/main/apis.yml
name: GS1
kind: company
description: >-
  GS1 (GS1 AISBL) is the not-for-profit, neutral standards body headquartered at Avenue Louise 523, 1050
  Brussels, Belgium, that maintains the identification keys and data standards the rest of the supply chain
  hangs its transactions on — GTIN, GLN, SSCC, GINC and GSIN, the barcode and EPC/RFID capture standards,
  EPCIS and the Core Business Vocabulary for supply chain visibility events, GS1 Digital Link, and EANCOM,
  GS1's own subset of UN/EDIFACT. GS1 does not run a commercial logistics service; it sits underneath every
  party in the chain, defining the identifiers a shipper, forwarder, carrier, terminal, customs authority and
  last-mile network all quote at each other. Its API posture is unusually open for a standards body: the full
  standards library is downloadable free as PDF from ref.gs1.org with no login, EPCIS 2.0.1 ships a normative
  OpenAPI 3.0.3 REST binding plus JSON Schema, XSD, WSDL, SHACL and JSON-LD ontologies, and GS1 AISBL itself
  operates a live, unauthenticated GS1-Conformant Resolver at id.gs1.org. What is gated is the other half —
  issuing GS1 identifiers and querying the Verified by GS1 registry are federated to national GS1 Member
  Organisations and sold under paid membership or a commercial API subscription, not offered self-serve by
  the Global Office.
