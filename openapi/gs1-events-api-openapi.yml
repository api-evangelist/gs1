    413QueryScopeOrSize:
      description: Query result is too large.
      content:
        application/problem+json:
          schema:
            example:
              type: epcisException:QueryTooComplexException
              title: Capture Payload too large
              status: 413
            allOf:
            - properties:
                status:
                  type: integer
                  enum:
                  - 413
                  default: 413
                type:
                  type: string
                  format: uri
                  enum:
                  - epcisException:QueryTooLargeException
