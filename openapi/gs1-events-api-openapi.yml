      description: Contains EPCIS events.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/epcisQueryDocument'
          example:
            '@context':
            - https://ref.gs1.org/standards/epcis/epcis-context.jsonld
            - example: http://ns.example.com/epcis/
            id: https://id.example.org/document1
            type: EPCISQueryDocument
            schemaVersion: '2.0'
            creationDate: '2005-07-11T11:30:47.0Z'
            epcisBody:
              queryResults:
                subscriptionID: 32d2aec1-a6d2-46d9-900a-24124288cce1
                queryName: SimpleEventQuery
                resultsBody:
                  eventList:
                  - eventID: ni:///sha-256;df7bb3c352fef055578554f09f5e2aa41782150ced7bd0b8af24dd3ccb30ba69?ver=CBV2.0
                    type: ObjectEvent
                    action: OBSERVE
                    bizStep: shipping
                    disposition: in_transit
                    epcList:
                    - urn:epc:id:sgtin:0614141.107346.2017
                    - urn:epc:id:sgtin:0614141.107346.2018
                    eventTime: '2005-04-03T20:33:31.116000-06:00'
                    eventTimeZoneOffset: -06:00
                    readPoint:
                      id: urn:epc:id:sgln:0614141.07346.1234
                    bizTransactionList:
                    - type: po
                      bizTransaction: http://transaction.acme.com/po/12345678
                  - eventID: ni:///sha-256;00e1e6eba3a7cc6125be4793a631f0af50f8322e0ab5f2c0bab994a11cec1d79?ver=CBV2.0
                    type: ObjectEvent
                    action: OBSERVE
                    bizStep: receiving
                    disposition: in_progress
                    epcList:
                    - urn:epc:id:sgtin:0614141.107346.2018
                    eventTime: '2005-04-04T20:33:31.116-06:00'
                    eventTimeZoneOffset: -06:00
                    readPoint:
                      id: urn:epc:id:sgln:0012345.11111.400
                    bizLocation:
                      id: urn:epc:id:sgln:0012345.11111.0
                    bizTransactionList:
                    - type: po
                      bizTransaction: http://transaction.acme.com/po/12345678
                    - type: desadv
                      bizTransaction: urn:epcglobal:cbv:bt:0614141073467:1152
                    example:myField: Example of a vendor/user extension
        application/xml:
          schema:
            $ref: '#/components/schemas/EPCISXMLQueryDocument'
          example: "<epcis:EPCISDocument xmlns:epcis=\"urn:epcglobal:epcis:xsd:2\"\n\txmlns:cbvmda=\"urn:epcglobal:cbv:mda\" schemaVersion=\"2.0\" creationDate=\"2020-06-28T13:41:00.000Z\">\n\t<EPCISBody>\n\t\t<EventList>\n\t\t\t<!-- INFERENCE example with COMPLETENESS INFERRED -->\n\t\t\t<AggregationEvent>\n\t\t\t\t<eventTime>2020-06-07T17:10:16Z</eventTime>\n\t\t\t\t<eventTimeZoneOffset>+02:00</eventTimeZoneOffset>\n\t\t\t\t<parentID>urn:epc:id:sgtin:952001.1012345.22222223333</parentID>\n\t\t\t\t<childEPCs>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001001</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001002</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001003</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001004</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001005</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001006</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001007</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001008</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001009</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001010</epc>\n\t\t\t\t</childEPCs>\n\t\t\t\t<action>OBSERVE</action>\n\t\t\t\t<bizStep>urn:epcglobal:cbv:bizstep:receiving</bizStep>\n\t\t\t\t<disposition>urn:epcglobal:cbv:disp:in_progress</disposition>\n\t\t\t\t<readPoint>\n\t\t\t\t\t<id>urn:epc:id:sgln:9529999.99999.0</id>\n\t\t\t\t</readPoint>\n\t\t\t\t<bizLocation>\n\t\t\t\t\t<id>urn:epc:id:sgln:9529999.99999.0</id>\n\t\t\t\t</bizLocation>\n\t\t\t\t<bizTransactionList>\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:inv\">urn:epcglobal:cbv:bt:9520011111116:A123</bizTransaction>\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:po\">urn:epcglobal:cbv:bt:9529999999991:XYZ567</bizTransaction>\n\t\t\t\t\t<!-- suggestion: allow for reference to packing event(s)\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:packevent\">urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6</bizTransaction>\n\t\t\t\t\t-->\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:desadv\">urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6</bizTransaction>\n\t\t\t\t</bizTransactionList>\n\t\t\t\t<sourceList>\n\t\t\t\t\t<source type=\"urn:epcglobal:cbv:sdt:owning_party\">urn:epc:id:pgln:9520001.11111</source>\n\t\t\t\t</sourceList>\n\t\t\t\t<destinationList>\n\t\t\t\t\t<destination type=\"urn:epcglobal:cbv:sdt:owning_party\">urn:epc:id:pgln:9520999.99999</destination>\n\t\t\t\t</destinationList>\n\t\t\t\t<!-- COMPLETENESS INFERRED -->\n\t\t\t\t<persistentDisposition>\n\t\t\t\t\t<set>urn:epcglobal:cbv:disp:completeness_inferred</set>\n\t\t\t\t</persistentDisposition>\n\t\t\t</AggregationEvent>\n\t\t\t<!-- UNPACKING event with VERIFICATION of COMPLETENESS -->\n\t\t\t<AggregationEvent>\n\t\t\t\t<eventTime>2020-06-08T18:11:16Z</eventTime>\n\t\t\t\t<eventTimeZoneOffset>+02:00</eventTimeZoneOffset>\n\t\t\t\t<parentID>urn:epc:id:sgtin:952001.1012345.22222223333</parentID>\n\t\t\t\t<childEPCs>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001001</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001002</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001003</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001004</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001005</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001006</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001007</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001008</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001009</epc>\n\t\t\t\t\t<epc>urn:epc:id:sgtin:9520001.012346.10000001010</epc>\n\t\t\t\t</childEPCs>\n\t\t\t\t<action>DELETE</action>\n\t\t\t\t<bizStep>urn:epcglobal:cbv:bizstep:unpacking</bizStep>\n\t\t\t\t<disposition>urn:epcglobal:cbv:disp:in_progress</disposition>\n\t\t\t\t<readPoint>\n\t\t\t\t\t<id>urn:epc:id:sgln:9529999.99999.0</id>\n\t\t\t\t</readPoint>\n\t\t\t\t<bizLocation>\n\t\t\t\t\t<id>urn:epc:id:sgln:9529999.99999.0</id>\n\t\t\t\t</bizLocation>\n\t\t\t\t<bizTransactionList>\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:inv\">urn:epcglobal:cbv:bt:9520011111116:A123</bizTransaction>\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:po\">urn:epcglobal:cbv:bt:9529999999991:XYZ567</bizTransaction>\n\t\t\t\t\t<!-- suggestion: allow for reference to packing event(s)\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:packevent\">urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6</bizTransaction>\n\t\t\t\t\t-->\n\t\t\t\t\t<bizTransaction type=\"urn:epcglobal:cbv:btt:desadv\">urn:uuid:f81d4fae-7dec-11d0-a765-00a0c91e6bf6</bizTransaction>\n\t\t\t\t</bizTransactionList>\n\t\t\t\t<sourceList>\n\t\t\t\t\t<source type=\"urn:epcglobal:cbv:sdt:owning_party\">urn:epc:id:pgln:9520001.11111</source>\n\t\t\t\t</sourceList>\n\t\t\t\t<destinationList>\n\t\t\t\t\t<destination type=\"urn:epcglobal:cbv:sdt:owning_party\">urn:epc:id:pgln:9520999.99999</destination>\n\t\t\t\t</destinationList>\n\t\t\t\t<!-- COMPLETENESS VERIFIED -->\n\t\t\t\t<persistentDisposition>\n\t\t\t\t\t<unset>urn:epcglobal:cbv:disp:completeness_inferred</unset>\n\t\t\t\t\t<set>urn:epcglobal:cbv:disp:completeness_verified</set>\n\t\t\t\t</persistentDisposition>\n\t\t\t</AggregationEvent>\n\t\t</EventList>\n\t</EPCISBody>\n</epcis:EPCISDocument>\n"
    101WebsocketCreated:
      description: 'Create a WebSocket connection to subscribe to queries. Upon subscription, the server SHALL send all new events

        to subscribing clients. If multiple clients have the same query, each client will receive events which they are

        authorized to see.

        '
      headers:
        Upgrade:
          required: true
          schema:
            type: string
            default: websocket
        Connection:
          required: true
          schema:
            type: string
            default: upgrade
        GS1-Query-Min-Record-Time:
          required: false
          schema:
            $ref: '#/components/schemas/GS1-Query-Min-Record-Time'
