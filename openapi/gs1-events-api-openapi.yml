                  - epcisException:NotAcceptableException
            - $ref: '#/components/schemas/RFC7807ProblemResponseBody'
    200EPCISQueryDocument:
      headers:
        GS1-EPCIS-Version:
          $ref: '#/components/headers/GS1-EPCIS-Version'
        GS1-CBV-Version:
