openapi: 3.2.0
info:
  version: 2.0.1
  title: EPCIS 2.0 REST Bindings Events API
  license:
    name: Apache2
  description: 'Endpoints that allow you to retrieve EPCIS events as Web resources.

    '
tags:
- name: Events
  description: 'Endpoints that allow you to retrieve EPCIS events as Web resources.

    '
