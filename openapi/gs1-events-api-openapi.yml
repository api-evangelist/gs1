        - anyOf:
          - type: object
            properties:
              inputEPCList:
                type: array
                minItems: 1
                items:
                  type: string
            required:
            - inputEPCList
          - type: object
            properties:
              inputQuantityList:
                type: array
                minItems: 1
                items:
                  type: object
            required:
            - inputQuantityList
          - type: object
            properties:
              outputEPCList:
