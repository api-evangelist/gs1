      - $ref: '#/components/parameters/GE_endTime'
      - $ref: '#/components/parameters/LT_endTime'
      - $ref: '#/components/parameters/EQ_type'
      - $ref: '#/components/parameters/EQ_deviceID'
      - $ref: '#/components/parameters/EQ_dataProcessingMethod'
