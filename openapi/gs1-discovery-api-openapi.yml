        '
      type: string
      example: 3A15506738749783AU6D7DENAKwM2gQRRwGrataeq
    GS1-CBV-XML-Format:
      example: Always_Web_URI
      type: string
      enum:
      - No_Preference
      - Always_Web_URI
      - Always_URN
      - Never_Translates
    EventTypeCollection:
      type: object
      description: Event type item list
      example:
        '@context':
        - https://ref.gs1.org/standards/epcis/epcis-context.jsonld
        - ex: https://example.org/myCustomEventTypes/
        type: Collection
        member:
        - AggregationEvent
        - AssociationEvent
        - ObjectEvent
        - TransactionEvent
        - TransformationEvent
        - ex:aCustomEventType
      required:
      - '@context'
      - type
      - member
      properties:
        '@context':
          $ref: '#/components/schemas/LDContext'
        type:
          type: string
          enum:
          - Collection
        member:
          type: array
          items:
            $ref: '#/components/schemas/EPCISEventTypes'
          uniqueItems: true
    GS1-EPCIS-Min:
      allOf:
      - example: 1.0.0
      - $ref: '#/components/schemas/version'
    PerPage:
      description: 'This parameter helps to control the amount of data returned to the client through pagination.

        In the case of EPCIS events, `perPage` specifies the maximum number of events in a response to the client.

        It does not mandate that the server reaches this limit. For example, if the server sees that some EPCIS events are very

        large, the server can decide to return fewer events to avoid creating an error because the response body is too

        large.

        As long as there are more resources to retrieve, the `Link` header contains the URL of the next page and

        the attribute `rel="next"`. The last page is indicated by the absence of the `rel="next"`. Depending on the

        implementation, there can be a global upper limit for the `perPage` value that the client cannot override,

        which should be stated in the documentation.

        '
      type: integer
      default: 30
    EPCISEventTypes:
      description: The five types of EPCIS events or an extended event denoted by a URI.
      example:
      - AggregationEvent
      - AssociationEvent
      - ObjectEvent
      - TransactionEvent
      - TransformationEvent
      anyOf:
      - type: string
        enum:
        - AggregationEvent
        - AssociationEvent
        - ObjectEvent
        - TransactionEvent
        - TransformationEvent
      - type: string
        format: uri
    GS1-Query-Min-Record-Time:
      example: '2020-04-04T20:33:31.116-06:00'
      description: "In the context of an active query subscription, its value is set initially to \n`initialRecordTime` and then updated to the most recent execution timestamp \nfor the standing query.\n"
      type: string
      format: date-time
    GS1-Next-Page-Token-Expires:
      example: '2017-07-21T17:32:28Z'
      type: string
      format: date-time
    GS1-EPCIS-Max:
      allOf:
      - example: 2.0.1
      - $ref: '#/components/schemas/version'
    GS1-Capture-Error-Behaviour:
      example: rollback
      type: string
      default: rollback
      enum:
      - rollback
      - proceed
      - all
    version:
      type: string
      pattern: ^\d+(\.\d+)*$
    GS1-EPCIS-Capture-Limit:
      example: 500
      type: integer
      minimum: 1
    TopLevelResourceCollection:
      type: object
      required:
      - '@context'
      - type
      - member
      properties:
        '@context':
          $ref: '#/components/schemas/LDContext'
        type:
          type: string
          enum:
          - Collection
        member:
          type: array
          items:
            $ref: '#/components/schemas/TopLevelResources'
          uniqueItems: true
          minItems: 9
    subscriptionID:
      description: The ID of a WebHook subscription.
      example: df5a33e3-5aa3-4403-ae01-99b83234e27b
      type: string
    RFC7807ProblemResponseBody:
      description: A response as specified in [RFC 7807](https://tools.ietf.org/html/rfc7807).
      type: object
      required:
      - type
      - title
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
      xml:
        name: EPCISException
        prefix: epcis
        namespace: urn:epcglobal:epcis:xsd:2
    GS1-Vendor-Version:
      example: example-version-1.0
      anyOf:
      - type: string
      - type: object
    QueryName:
      description: Unique query name.
      type: string
      example: myQuery
    GS1-EPC-Format:
      example: Always_GS1_Digital_Link
      type: string
      enum:
      - No_Preference
      - Always_GS1_Digital_Link
      - Always_EPC_URN
      - Never_Translates
    GS1-CBV-Version:
      allOf:
      - example: 2.0.1
      - $ref: '#/components/schemas/version'
    Link:
      description: 'A pagination header link. This header works together with the `perPage` and `nextPageToken` query string

        parameters.

        '
      type: string
      format: uri
      example: <https://example.com/epcis/events?perPage=30&nextPageToken=3A15506738749783AU6D7DENAKwM2gQRRwGrataeq>; rel="next"
    TopLevelResources:
      type: string
      description: The seven top level resources of an EPCIS.
      example:
      - events
      - eventTypes
      - epcs
      - bizSteps
      - bizLocations
      - readPoints
      - dispositions
      - capture
      - queries
      enum:
      - events
      - eventTypes
      - epcs
      - bizSteps
      - bizLocations
      - readPoints
      - dispositions
      - capture
      - queries
    GS1-EPCIS-Capture-File-Size-Limit:
      example: 1024
      type: integer
      minimum: 1
    GS1-CBV-Min:
      allOf:
      - example: 1.2.0
      - $ref: '#/components/schemas/version'
    GS1-CBV-Max:
      allOf:
      - example: 2.0.1
      - $ref: '#/components/schemas/version'
