actions:
  apisListed: 2
  openapiHarvested: true
  specsCount: 8
  imageSource: https://ref.gs1.org/favicon-196x196.png (HTTP 200, image/png) — real GS1 mark, so the placeholder was not used.
  note: >-
    apis[] contains only surfaces GS1 itself publishes or operates. Member Organisation APIs (GS1 US,
    GS1 UK, GS1 Sweden) are deliberately excluded — they are separate legal entities and belong in their
    own repos.
